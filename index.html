<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Stream - Join the Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide scrollbar for a clean mobile app feel */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth pop-in animation for new chats */
        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-msg { animation: popIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col max-w-md mx-auto shadow-2xl relative overflow-hidden font-sans selection:bg-purple-500/30">

    <!-- ================= TOP HEADER ================= -->
    <div class="bg-zinc-900/80 backdrop-blur-md border-b border-white/10 p-4 sticky top-0 z-20 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-rose-600 animate-pulse w-3 h-3 rounded-full"></div>
            <h1 class="font-bold text-lg tracking-tight">Live Broadcast</h1>
        </div>
        <span class="bg-white/10 text-xs font-mono px-2.5 py-1 rounded-md text-zinc-300">Live Chat</span>
    </div>

    <!-- ================= ANNOUNCEMENT BANNER ================= -->
    <div id="public-announcement" class="bg-blue-600/90 text-white p-3 text-sm font-bold shadow-md hidden z-10">
        📢 <span id="public-announcement-text"></span>
    </div>

    <!-- ================= INTERACTIVE POLL UI ================= -->
    <div id="public-poll" class="hidden bg-gradient-to-br from-purple-900/50 to-indigo-900/50 border-b border-purple-500/30 p-5 shadow-lg z-10 shrink-0">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] uppercase font-black tracking-widest text-purple-300 bg-purple-500/30 px-2 py-1 rounded-md">Live Poll</span>
        </div>
        <h2 id="poll-q" class="text-base font-bold text-white mb-3">Question goes here?</h2>
        
        <div class="space-y-2">
            <button onclick="vote('A')" id="btn-a" class="w-full text-left relative overflow-hidden bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-white/10 transition-all active:scale-[0.98]">
                <div id="bar-a" class="absolute left-0 top-0 bottom-0 bg-purple-600/60 transition-all duration-500 z-0" style="width: 0%"></div>
                <div class="relative z-10 flex justify-between font-bold text-sm">
                    <span id="opt-a">Option A</span>
                    <span id="pct-a" class="font-mono">0%</span>
                </div>
            </button>
            <button onclick="vote('B')" id="btn-b" class="w-full text-left relative overflow-hidden bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-white/10 transition-all active:scale-[0.98]">
                <div id="bar-b" class="absolute left-0 top-0 bottom-0 bg-pink-600/60 transition-all duration-500 z-0" style="width: 0%"></div>
                <div class="relative z-10 flex justify-between font-bold text-sm">
                    <span id="opt-b">Option B</span>
                    <span id="pct-b" class="font-mono">0%</span>
                </div>
            </button>
        </div>
        <p id="vote-msg" class="text-xs text-center text-purple-300 mt-3 hidden">Thanks for voting!</p>
    </div>

    <!-- ================= CHAT FEED ================= -->
    <div id="chat-feed" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-2">
        <!-- Chat messages will inject here -->
        <div class="text-center text-xs text-zinc-500 my-2">Welcome to the live chat! Be respectful.</div>
    </div>

    <!-- ================= CHAT INPUT & REACTIONS ================= -->
    <div class="bg-zinc-900 border-t border-white/10 p-3 pb-safe shrink-0">
        <!-- Reaction Bar -->
        <div class="flex justify-between items-center mb-3 px-2">
            <span class="text-xs text-zinc-500 font-bold uppercase tracking-wider">React</span>
            <div class="flex gap-2">
                <button onclick="sendReaction('❤️')" class="bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-full text-xl transition-transform active:scale-90 shadow-sm">❤️</button>
                <button onclick="sendReaction('🔥')" class="bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-full text-xl transition-transform active:scale-90 shadow-sm">🔥</button>
                <button onclick="sendReaction('👏')" class="bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-full text-xl transition-transform active:scale-90 shadow-sm">👏</button>
            </div>
        </div>

        <!-- Text Input -->
        <div class="flex flex-col gap-2">
            <input type="text" id="viewer-name" placeholder="Your Name" class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 transition-colors">
            <div class="flex gap-2">
                <input type="text" id="viewer-msg" placeholder="Type a message..." class="flex-1 bg-black/50 border border-white/10 rounded-lg px-3 py-3 text-sm focus:outline-none focus:border-amber-500 transition-colors" onkeypress="if(event.key === 'Enter') sendChat()">
                <button onclick="sendChat()" class="bg-amber-600 hover:bg-amber-500 px-5 font-bold rounded-lg text-sm transition-all active:scale-95 shadow-md">Send</button>
            </div>
        </div>
    </div>

    <!-- ================= FIREBASE ENGINE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, onChildAdded, onChildRemoved, runTransaction, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2e_KYmd_G5S0RR9QJ2C9Ut79Hb1RhmAA",
            authDomain: "yt-live-stream-4e4ea.firebaseapp.com",
            databaseURL: "https://yt-live-stream-4e4ea-default-rtdb.firebaseio.com",
            projectId: "yt-live-stream-4e4ea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- 1. CHAT SYSTEM ---
        const chatFeed = document.getElementById('chat-feed');
        const sessionStartTime = Date.now() - (20 * 60 * 1000); // Ignore chats older than 20 mins

        window.sendChat = function() {
            let name = document.getElementById('viewer-name').value.trim();
            const text = document.getElementById('viewer-msg').value.trim();
            
            if(!text) return;
            if(!name) { name = "Viewer"; document.getElementById('viewer-name').value = name; }
            
            // Prevent users from pretending to be the Host
            if(name.toLowerCase() === 'host') name = "Host (Fake)";

            const newRef = push(ref(db, 'messages'));
            set(newRef, { id: newRef.key, name, text, time: Date.now() });
            
            document.getElementById('viewer-msg').value = '';
        };

        onChildAdded(query(ref(db, 'messages'), limitToLast(50)), (snapshot) => {
            const msg = snapshot.val();
            if (msg.time < sessionStartTime) return;

            const div = document.createElement('div');
            div.id = `msg-${msg.id}`;
            div.className = "chat-msg bg-black/40 border border-white/5 p-3 rounded-2xl w-fit max-w-[90%]";
            
            const isHost = msg.name.toLowerCase() === 'host';
            const nameColor = isHost ? 'text-purple-400' : 'text-zinc-300';
            const badge = isHost ? '<span class="bg-purple-600 text-white text-[9px] px-1.5 py-0.5 rounded-sm ml-2 uppercase">Host</span>' : '';

            div.innerHTML = `
                <div class="flex items-center mb-0.5">
                    <span class="${nameColor} font-bold text-xs">${escapeHtml(msg.name)}</span>
                    ${badge}
                </div>
                <p class="text-white text-sm leading-snug break-words">${escapeHtml(msg.text)}</p>
            `;
            
            chatFeed.appendChild(div);
            requestAnimationFrame(() => chatFeed.scrollTop = chatFeed.scrollHeight);
        });

        // Remove chat instantly if Admin deletes it
        onChildRemoved(ref(db, 'messages'), (snapshot) => {
            const id = snapshot.key;
            const el = document.getElementById(`msg-${id}`);
            if (el) el.remove();
        });

        // --- 2. POLL SYSTEM ---
        let currentPollId = null;

        window.vote = function(opt) {
            if(!currentPollId) return;
            
            // Basic check to prevent spam voting from the same browser
            if(localStorage.getItem(`voted_${currentPollId}`)) {
                document.getElementById('vote-msg').innerText = "You have already voted!";
                document.getElementById('vote-msg').classList.remove('hidden');
                return;
            }

            runTransaction(ref(db, `activePoll/votes${opt}`), (curr) => (curr || 0) + 1);
            localStorage.setItem(`voted_${currentPollId}`, 'true');
            
            document.getElementById('vote-msg').innerText = "Thanks for voting!";
            document.getElementById('vote-msg').classList.remove('hidden');
        };

        onValue(ref(db, 'activePoll'), (snapshot) => {
            const data = snapshot.val();
            const pollEl = document.getElementById('public-poll');
            
            if (!data || !data.active) {
                pollEl.classList.add('hidden');
                return;
            }

            currentPollId = data.createdAt; // Use timestamp as unique ID
            pollEl.classList.remove('hidden');

            document.getElementById('poll-q').innerText = data.question;
            document.getElementById('opt-a').innerText = data.optA;
            document.getElementById('opt-b').innerText = data.optB;

            const total = (data.votesA + data.votesB) || 1;
            const pctA = Math.round((data.votesA / total) * 100);
            const pctB = (data.votesA + data.votesB) === 0 ? 0 : 100 - pctA;

            document.getElementById('pct-a').innerText = pctA + '%';
            document.getElementById('pct-b').innerText = pctB + '%';
            document.getElementById('bar-a').style.width = pctA + '%';
            document.getElementById('bar-b').style.width = pctB + '%';

            // Hide the vote message if a new poll starts
            if(!localStorage.getItem(`voted_${currentPollId}`)) {
                document.getElementById('vote-msg').classList.add('hidden');
            }
        });

        // --- 3. ANNOUNCEMENT SYSTEM ---
        onValue(ref(db, 'announcement'), (snapshot) => {
            const data = snapshot.val();
            const banner = document.getElementById('public-announcement');
            if (data && data.active) {
                document.getElementById('public-announcement-text').innerText = data.text;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        });

        // --- 4. REACTIONS ---
        window.sendReaction = function(emoji) {
            push(ref(db, 'reactions'), { emoji, time: Date.now() });
            
            // Visual feedback for the viewer clicking it
            const btn = event.currentTarget;
            btn.classList.add('bg-white/20');
            setTimeout(() => btn.classList.remove('bg-white/20'), 150);
        };

        // Utility to prevent HTML injection attacks
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
